# Production stack: the PocketBase CMS image built by .github/workflows/docker.yml.
# The web app runs on Cloudflare Workers (.github/workflows/cloudflare.yml).
# See DEPLOYMENT.md. Values come from a .env file next to this file.
name: web-alkautsar

services:
  cms:
    image: ghcr.io/reynadi531/web-alkautsar-cms:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - cms_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  cms_data:
