# Production stack: runs the images built by .github/workflows/docker.yml.
# See DEPLOYMENT.md. Values come from a .env file next to this file.
name: web-alkautsar

services:
  cms:
    image: ghcr.io/reynadi531/web-alkautsar-cms:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - cms_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/reynadi531/web-alkautsar-web:${IMAGE_TAG:-latest}
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # Server-side API calls stay on the compose network; browsers load
      # uploaded files from the public address.
      POCKETBASE_URL: http://cms:8090
      POCKETBASE_PUBLIC_URL: ${POCKETBASE_PUBLIC_URL:?set POCKETBASE_PUBLIC_URL in .env}
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  cms_data:
